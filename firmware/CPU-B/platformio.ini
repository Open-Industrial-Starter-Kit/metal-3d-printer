; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Piccola CNC CPUB firmware for the RP2350 (Raspberry Pi Pico 2 W), Arduino-Pico core by Earle Philhower.
; Platform and libraries are pinned to the versions this firmware is built and tested with.
[env:rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#24f5f5b668907cddae741529a40d344de5a5cf19
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	bakercp/PacketSerial@1.4.0
	adafruit/Adafruit INA219@1.2.3
	4-20ma/ModbusMaster@2.0.1
