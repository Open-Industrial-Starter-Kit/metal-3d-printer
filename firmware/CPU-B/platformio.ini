; https://docs.platformio.org/page/projectconf.html

; CPU-B firmware for the OISK Metal 3D Printer, Control Board V2.
; Arduino-Pico core by Earle Philhower, platform and libraries pinned to the
; versions this firmware is built and tested with.
;
; The board is a plain RP2350B. It carries no CYW43 radio: the Piccola CNC
; firmware this is derived from targeted rpipico2w and reached the network
; through an external ESP32-C3, neither of which is present here. Networking
; on this board is a WIZnet W5500 on SPI0.
[env:rp2350b]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#24f5f5b668907cddae741529a40d344de5a5cf19
board = MyRP_2350B
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	bakercp/PacketSerial@1.4.0
	adafruit/Adafruit INA219@1.2.3
	4-20ma/ModbusMaster@2.0.1
