; CPU-B passthrough test - OISK Metal 3D Printer, Control Board V2
;
; Bridges the CPU-B USB-C port to the UART0 link to CPU-A, so grblHAL on
; CPU-A can be driven from a host G-code sender.
;
; Platform pinned to the same commit the Piccola CNC CPU-B firmware is built
; with. The board MyRP_2350B is a plain RP2350B, 4 MB flash: the Control Board
; V2 carries no CYW43 radio, so the rpipico2w board used by the Piccola CNC
; firmware is not the right target here.
;
; If MyRP_2350B is not installed, generic_rp2350 also works for this test -
; it only uses GP0, GP1 and USB.

[env:cpub_passthrough]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#24f5f5b668907cddae741529a40d344de5a5cf19
board = MyRP_2350B
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
